<div class="bd">
  <div class="wrapper">
    <span class="bg-animate"></span>
    <div class="form-box login">
      <h1>Iniciar sesión</h1>
      <form>
        <div class="input-box">
          <input type="text" [(ngModel)]="usuario" name="usuario" required>
          <label>Usuario</label>
        </div>
        
        <div class="input-box">
          <input type="password" [(ngModel)]="contra" name="contra" required>
          <label>Contraseña</label>
        </div>

        <button type="submit" class="btn" (click)="login()">
          Ingresar
        </button>
      </form>  
    </div>

    <div class="info-text login">
      <h2>¡Bienvenido!</h2>
      <p>Tecnología que optimiza tus recursos académicos.</p>
    </div>
  </div>
</div>
