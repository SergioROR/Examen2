<div class="page-container">

  <div class="card form-card">

    <div class="card-header">
      <h4>Crear Plantel</h4>
    </div>

    <div class="card-body">

      <form (ngSubmit)="onSubmit()" #formPlantel="ngForm">

        <div class="form-layout">

          
          <div class="image-section">

            <div class="upload-box" (click)="fileInput.click()">

              <input
                #fileInput
                type="file"
                accept="image/*"
                (change)="onFileSelected($event)"
                hidden
              >

           
              <div *ngIf="!previewUrl" class="upload-placeholder">
                <i class="bi bi-image"></i>
                <p>Subir imagen</p>
                <small>JPG o PNG</small>
              </div>

             
              <img
                *ngIf="previewUrl"
                [src]="previewUrl"
                class="preview-img"
              >

            </div>

          </div>

          <div class="fields-section">

            <label>Nombre del plantel</label>

            <input
              type="text"
              class="form-control input-modern"
              [(ngModel)]="plantel.nombre"
              name="nombre"
              placeholder="Ej. Campus Central"
              required
            >

          </div>

        </div>

        <div class="buttons">

          <button
            type="button"
            class="btn-glass-secondary"
            routerLink="/planteles"
          >
            <i class="bi bi-arrow-left"></i>
            Regresar
          </button>

          <button
            type="submit"
            class="btn-glass"
            [disabled]="formPlantel.invalid || enviando"
          >
            <i class="bi bi-check-lg"></i>
            Crear Plantel
          </button>

        </div>

      </form>

    </div>

  </div>

</div>
